[project]
name = "tutti-frutti-py"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pyrefly>=0.60.0",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "faker>=33.0.0",
    "allure-pytest>=2.13.5",
    "ruff>=0.16.6",
]

[project.optional-dependencies]
ui = ["playwright>=1.48.0", "pytest-playwright>=0.6.0"]
grpc = ["grpcio>=1.68.0", "grpcio-tools>=1.68.0", "protobuf>=5.28.0"]
db = ["pymongo>=4.10.0", "psycopg[binary]>=3.2.0"]
load = ["locust>=2.32.0"]
dev = ["ruff>=0.7.0"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-s"
testpaths = ["tests"]
markers = [
    "api: REST/gRPC API tests",
    "ui: Playwright UI tests",
    "db: Mongo/Postgres data tests",
    "grpc: gRPC-specific tests",
]

