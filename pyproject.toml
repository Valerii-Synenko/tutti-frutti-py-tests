[project]
name = "tutti-frutti-py"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pytest==9.1.1",
    "pydantic[email]==2.14.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.4",
    "faker==40.43.0",
    "ruff==0.17.0",
    "ty==0.0.86",
    "psycopg==3.3.6",
    "bcrypt>=5.0.0",
    "psycopg-pool>=3.3.3",
    "modelfactory>=15",
    "polyfactory>=3.3.0",
    "qase-pytest==9.0.0",
]

[project.optional-dependencies]
ui = ["playwright>=1.48.0", "pytest-playwright>=0.6.0"]
grpc = ["grpcio>=1.68.0", "grpcio-tools>=1.68.0", "protobuf>=5.28.0"]
db = ["pymongo>=4.10.0", "psycopg[binary]>=3.2.0"]
load = ["locust>=2.32.0"]
ai = ["deepeval>=2.0"]
dev = ["ruff>=0.7.0"]

[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = ["protos"]
src = ["framework", "tests", "load", "scripts"]
respect-gitignore = true
show-fixes = true
output-format = "concise"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "PT", "B", "ARG", "SIM", "UP", "C4", "RUF", "ISC", "PERF", "S"]
ignore = ["S101"]

[tool.ty.environment]
python = ".venv"

[tool.ty.src]
respect-ignore-files = true
exclude = ["test_data", "protos"]

[tool.ty.rules]
possibly-unresolved-reference = "warn"

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-s --import-mode=importlib"
testpaths = ["tests"]
